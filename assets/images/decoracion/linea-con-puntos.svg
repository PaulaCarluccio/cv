<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" fill="none">
<defs>
  <filter id="lapiz" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="3" result="warp"/>
    <feDisplacementMap in="SourceGraphic" in2="warp" scale="4" result="rough"/>
